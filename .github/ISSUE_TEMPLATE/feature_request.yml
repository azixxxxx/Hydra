name: Feature request
description: Propose a bounded change within or beyond the documented 1.0 scope.
title: '[feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user outcome is missing?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Boundary and trade-offs
      description: Explain effects on subscription safety, context replication, isolation, persistence, and platform support.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: What deterministic tests would prove the change?
    validations:
      required: true

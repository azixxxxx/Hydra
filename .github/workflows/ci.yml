name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64 / Node ${{ matrix.node }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        node: ['20.9.0', '24.x']
    env:
      HYDRA_REAL_CLAUDE_SMOKE: '0'
      HYDRA_REAL_ISOLATION_SMOKE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify committed bundles are current
        run: git diff --exit-code -- plugins/hydra/dist
      - run: npm audit --omit=dev
      - run: node --check plugins/hydra/dist/server.js
      - run: node --check plugins/hydra/dist/worker.js

  source-scan:
    name: Public-source guard
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Reject private paths and unfinished markers
        shell: bash
        run: |
          if rg -n '/Users/|file://|\b(?:TODO|FIXME)\b' \
            plugins/hydra/src plugins/hydra/README.md plugins/hydra/skills \
            README.md SECURITY.md CONTRIBUTING.md CHANGELOG.md \
            docs/1.0-boundary.md docs/adr scripts/build.mjs package.json; then
            exit 1
          fi
